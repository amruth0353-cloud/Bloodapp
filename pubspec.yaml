name: bloodapp2
description: BloodConnect - Smart Blood Donation Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_animate: ^4.3.0
  badges: ^3.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  url_launcher: ^6.2.2
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  flutter_local_notifications: ^17.0.0
  cupertino_icons: ^1.0.2
  googleapis_auth: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/service_account.json
